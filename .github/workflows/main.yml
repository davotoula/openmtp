name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple Silicon, matching the arm64-only release builds
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      # Dependency lifecycle scripts are disabled: none of them is needed to
      # build (they download the Electron runtime and sentry-cli, install git
      # hooks, verify koffi's bundled N-API prebuild, or print attribution
      # notices). The one step that is needed -- compiling the native modules
      # bundled into the app against Electron's headers -- runs explicitly below.
      #
      # --ignore-scripts leaves node_modules/electron without a binary, and
      # nothing in this job needs one: electron-builder fetches the runtime zip
      # itself (below) and check-runtime-deps skips electron-ga, whose
      # require('electron') would need it. From Electron 42 the package has no
      # postinstall at all and require('electron') downloads on demand, so
      # this holds after the bump too.
      - name: Install dependencies (lifecycle scripts disabled)
        run: yarn install --frozen-lockfile --ignore-scripts

      # Packaging needs the Electron runtime zip from GitHub Releases, which
      # intermittently answers 5xx; electron-builder makes one attempt and fails
      # the job. It reuses a zip already in its cache dir without touching the
      # network, so keep the zip in the Actions cache and, on a miss, fetch it
      # here with retries and a checksum check.
      - name: Resolve Electron version
        id: electron
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron runtime
        id: electron-cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron/electron-v${{ steps.electron.outputs.version }}-darwin-arm64.zip
          key: electron-v${{ steps.electron.outputs.version }}-darwin-arm64

      - name: Download Electron runtime (cache miss only)
        if: steps.electron-cache.outputs.cache-hit != 'true'
        env:
          ELECTRON_VERSION: ${{ steps.electron.outputs.version }}
        run: |
          zip="electron-v${ELECTRON_VERSION}-darwin-arm64.zip"
          base="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}"
          # --max-time bounds each attempt, so a stalled transfer is retried
          # rather than hanging the job.
          fetch() {
            curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 \
              --retry 8 --retry-all-errors --retry-delay 15 "$@"
          }
          cd "$RUNNER_TEMP"
          fetch -o SHASUMS256.txt "$base/SHASUMS256.txt"
          fetch -o "$zip" "$base/$zip"
          grep " \*${zip}\$" SHASUMS256.txt | shasum -a 256 -c -
          mkdir -p ~/Library/Caches/electron
          mv "$zip" ~/Library/Caches/electron/

      - name: Build native modules for Electron
        run: yarn electron-builder install-app-deps

      - name: Lint styles
        run: yarn lint-styles

      # Runs `yarn build` (lint + webpack) first. With no signing secrets the
      # build takes the ad-hoc signing path in AfterPack and skips notarization,
      # which is exactly what an unsigned CI build should exercise.
      - name: Package macOS app (ad-hoc signed, not notarized)
        run: yarn package-mac-without-notarize

      # Everything above proves the app builds and packages, not that it runs.
      # PR #9 was green and shipped a blank window: a dependency had gone
      # ESM-only, which Electron 18's Node 16 cannot require(). Every entry in
      # package.json dependencies is a webpack external that the packaged app
      # loads at runtime, so load each one under the packaged app's own Node
      # first. This catches ESM-only and ABI-broken modules in seconds.
      - name: Load runtime dependencies under Electron
        run: yarn check-runtime-deps

      # Then start the packaged app itself, attach over the DevTools protocol,
      # reload the renderer and fail if it throws or never mounts its React
      # root. Plain Node 22 (fetch + WebSocket), no Playwright.
      - name: Smoke-launch packaged app
        id: smoke
        run: yarn smoke-launch

      # The screenshot shows what the window actually looked like and the app
      # log carries main-process output; both are only interesting on failure.
      - name: Upload smoke-launch screenshot and app log
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-launch
          path: |
            dist/smoke-launch.png
            dist/smoke-launch.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify app bundle and signature
        run: |
          test -d dist/mac-arm64/OpenMTP-resume.app
          codesign --verify --deep --strict dist/mac-arm64/OpenMTP-resume.app
          # macOS 27 shows "App Update Required ... will not open in macOS 28"
          # for bundles carrying Intel-only executables (Rosetta goes away in
          # macOS 28), so every Mach-O in the bundle must include arm64.
          bad=$(find dist/mac-arm64/OpenMTP-resume.app -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.node' \) \
            -exec sh -c 'a=$(lipo -archs "$1" 2>/dev/null) || exit 0; case "$a" in *arm64*) ;; *) echo "$a $1";; esac' _ {} \;)
          [ -z "$bad" ] || { echo "Non-arm64 binaries in bundle:"; echo "$bad"; exit 1; }
          echo "Arch check: every Mach-O in the bundle includes arm64"
          cd dist && shasum -a 256 -- *.dmg *.zip | tee SHA256SUMS.txt

      - name: Upload DMG, zip and checksums
        uses: actions/upload-artifact@v7
        with:
          name: openmtp-resume-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
